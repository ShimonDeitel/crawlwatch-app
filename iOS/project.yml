name: Crawlwatch
options:
  bundleIdPrefix: com.shimondeitel.crawlwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Crawlwatch:
    type: application
    platform: iOS
    sources:
      - path: Crawlwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.crawlwatch
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Crawlwatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  CrawlwatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrawlwatchTests
      - path: Crawlwatch.storekit
    dependencies:
      - target: Crawlwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.crawlwatch.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  CrawlwatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrawlwatchUITests
    dependencies:
      - target: Crawlwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.crawlwatch.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Crawlwatch:
    build:
      targets:
        Crawlwatch: all
        CrawlwatchTests: [test]
        CrawlwatchUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Crawlwatch.storekit
    test:
      config: Debug
      storeKitConfiguration: Crawlwatch.storekit
      targets:
        - CrawlwatchTests
        - CrawlwatchUITests
    archive:
      config: Release
